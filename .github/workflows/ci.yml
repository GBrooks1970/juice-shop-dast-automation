# DAST lane CI (design note §9). PR-blocking and deterministic: boot the pinned, intentionally
# vulnerable OWASP Juice Shop, run the ZAP passive baseline + positive-detection verdict, run the
# BDD exploit-confirmation scenarios, then publish the labelled report to Pages on main.
#
# The verdict comes from parsing report.json (npm run scan:verdict) — NOT from zap-baseline.py's
# exit code, which is always non-zero on this target by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  dast:
    name: Scan + confirm (Juice Shop + ZAP)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    outputs:
      published: ${{ steps.pages.outputs.published }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: ZAP passive baseline scan
        run: npm run scan

      - name: Positive-detection verdict
        run: npm run scan:verdict

      - name: BDD exploit confirmations
        run: npm run bdd

      - name: Upload raw ZAP report (JSON + HTML)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: reports/
          if-no-files-exist: error

      - name: Build labelled Pages site
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run pages:build
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.dast.outputs.published == 'true'
    runs-on: ubuntu-latest
    # The first deploy onto a freshly (re)created Pages site can take several minutes to leave the
    # backend build queue; give it generous headroom so a slow first deploy is not timeout-cancelled.
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy labelled DAST report
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 1200000 # 20 min — match the generous job headroom for a slow first deploy
